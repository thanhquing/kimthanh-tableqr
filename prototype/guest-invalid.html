<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mã QR không hợp lệ</title>
<link rel="stylesheet" href="_shared.css">
<style>
.pad{padding:var(--s10) var(--s5);text-align:center}
.sym{width:76px;height:76px;margin:0 auto var(--s5);border-radius:50%;display:grid;
  place-items:center}
.sym.err{background:var(--st-cancel-bg);color:var(--st-cancel-fg)}
.sym.info{background:var(--st-new-bg);color:var(--ink-700)}
.sym.off{background:var(--st-prep-bg);color:var(--st-prep-fg)}
.pad h1{font-size:21px;margin:0 0 var(--s3)}
.pad p{color:var(--ink-600);margin:0 auto var(--s6);font-size:15px;max-width:34ch;line-height:1.6}
.tip{display:flex;gap:var(--s3);text-align:left;padding:var(--s4);border-radius:var(--r-md);
  background:var(--surface-sunken);border:1px solid var(--line-200);font-size:14px;
  color:var(--ink-700);line-height:1.55}
.switcher{display:flex;gap:6px;justify-content:center;margin-bottom:var(--s6);flex-wrap:wrap}
.switcher button{padding:6px 13px;border-radius:var(--r-pill);border:1px solid var(--line-300);
  font-size:13px;font-weight:600;color:var(--ink-600)}
.switcher button.on{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand-700)}
</style>
</head>
<body>
<div class="guest">
  <header class="g-hdr"><span class="g-title">Quán Cơm Kim Thành</span></header>
  <main class="pad">
    <div class="switcher">
      <button data-v="invalid" class="on">QR không hợp lệ</button>
      <button data-v="closed">Phiên đã kết thúc</button>
      <button data-v="offline">Mất mạng</button>
    </div>
    <div id="v"></div>
  </main>
</div>

<script src="_data.js"></script>
<script>
protobar()
const ic = {
  err:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>',
  info:'<path d="M9 11V7a3 3 0 0 1 6 0v4"/><rect x="4" y="11" width="16" height="9" rx="2"/>',
  off:'<path d="M2 2l20 20"/><path d="M5 12.5a10 10 0 0 1 4-2.4M1.5 9a15 15 0 0 1 5-3.2M9.5 16.2a5 5 0 0 1 5 0M22.5 9a15 15 0 0 0-8.6-3.9"/><path d="M12 20h.01"/>',
}
const V = {
  invalid:{k:'err',t:'Mã QR không hợp lệ',
    p:'Mã này không thuộc bàn nào của quán, hoặc bàn đã ngừng sử dụng.',
    /* Khong co nut nao — day la luc can con nguoi, khong phai luc thu lai */
    tip:'Vui lòng gọi nhân viên để được hỗ trợ gọi món. Nhân viên sẽ kiểm tra lại mã QR trên bàn.'},
  closed:{k:'info',t:'Phiên gọi món đã kết thúc',
    p:'Nhân viên đã hoàn tất và dọn bàn này. Đơn cũ vẫn được quán lưu lại.',
    tip:'Quét lại mã QR trên bàn để bắt đầu phiên gọi món mới.'},
  offline:{k:'off',t:'Không có kết nối mạng',
    p:'Không tải được thực đơn. Giỏ hàng của bạn vẫn được giữ nguyên.',
    btn:'Thử lại',
    tip:'Kiểm tra sóng 4G hoặc Wi-Fi của quán rồi thử lại.'},
}
function show(k){
  const v = V[k]
  document.getElementById('v').innerHTML = `
    <div class="sym ${v.k}"><svg width="36" height="36" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[v.k]}</svg></div>
    <h1>${v.t}</h1><p>${v.p}</p>
    ${v.btn?`<button class="btn btn-primary btn-block" style="margin-bottom:var(--s5)"
       onclick="toast('Đang thử lại...')">${v.btn}</button>`:''}
    <div class="tip">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" style="flex:0 0 18px;margin-top:2px;color:var(--ink-500)">
        <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>${v.tip}</span></div>`
}
document.querySelector('.switcher').addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(!b) return
  document.querySelectorAll('.switcher button').forEach(x=>x.classList.toggle('on',x===b))
  show(b.dataset.v)
})
show('invalid')
</script>
</body>
</html>
