<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giỏ hàng — Bàn 1</title>
<link rel="stylesheet" href="_shared.css">
<style>
.line{display:flex;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line-200)}
.line-th{flex:0 0 64px;width:64px;height:64px;border-radius:var(--r-md);overflow:hidden;
  background:var(--img-ph)}
.line-th img{width:100%;height:100%;object-fit:cover;display:block}
.line-th .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-500);
  font-size:24px;font-weight:700}
.line-in{flex:1;min-width:0}
.line-nm{font-size:16px;font-weight:600;margin:0 0 2px}
.line-pr{font-size:14px;color:var(--ink-600);margin:0 0 var(--s2)}
.note-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand-700);
  font-weight:600;padding:4px 0}
.note-txt{color:var(--ink-700);font-weight:500}
.line-rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;
  gap:var(--s2)}
.line-tot{font-size:16px;font-weight:700;white-space:nowrap}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line-300);
  border-radius:var(--r-md)}
.stp button{width:36px;height:36px;display:grid;place-items:center;font-size:19px;
  font-weight:600;color:var(--brand-700)}
.stp button:hover{background:var(--brand-50)}
.stp span{min-width:30px;text-align:center;font-size:15px;font-weight:700}
.sum{padding:var(--s5) var(--s4);background:var(--surface-sunken);
  border-top:1px solid var(--line-200)}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s2)}
.sum-row.big{margin:var(--s3) 0 0;padding-top:var(--s3);border-top:1px solid var(--line-300)}
.sum-row.big dt{font-size:16px;font-weight:700}
.sum-row.big dd{font-size:24px;font-weight:700}
dl,dd{margin:0}
dt{color:var(--ink-600);font-size:15px}
dd{font-size:15px;font-weight:600}
.foot{position:sticky;bottom:0;padding:var(--s4);background:var(--surface);
  border-top:1px solid var(--line-200);box-shadow:var(--sh-sheet)}
.warn{display:flex;gap:var(--s2);padding:var(--s3);border-radius:var(--r-md);
  background:var(--st-cancel-bg);color:var(--st-cancel-fg);font-size:14px;font-weight:600;
  margin:var(--s4) var(--s4) 0}
.line.bad{background:#FFF8F8}
.line.bad .line-th img{filter:grayscale(1);opacity:.5}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="guest">
  <header class="g-hdr">
    <a href="guest-menu.html" class="g-back" aria-label="Quay lại thực đơn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span class="g-title">Giỏ hàng</span>
    <span class="g-table">Bàn 1</span>
  </header>
  <main id="main"></main>
</div>

<script src="_data.js"></script>
<script>
protobar()
/* Mo bang du lieu mau neu gio dang rong — de xem duoc man hinh ngay */
if (!getCart().length) setCart([
  { id:'item-ca-phe-sua-da', n:2, note:'ít đá' },
  { id:'item-com-tam-suon', n:1, note:'không mỡ hành' },
  { id:'item-lau-thai', n:1, note:'' },
])

let sending = false
/* Bat cho mon het hang de thu loi ITEMS_UNAVAILABLE */
let showUnavailable = false

function render(){
  const cart = getCart(), main = document.getElementById('main')

  if (!cart.length){
    main.innerHTML = `<div class="state">
      <h2>Chưa chọn món nào</h2>
      <p>Xem thực đơn và chọn món bạn muốn gọi.</p>
      <a class="btn btn-primary" href="guest-menu.html">Xem thực đơn</a></div>`
    return
  }

  const bad = showUnavailable ? ['item-com-tam-suon'] : []
  main.innerHTML = `
    ${bad.length ? `<div class="warn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" style="flex:0 0 18px;margin-top:1px">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></svg>
      <span>Món “Cơm tấm sườn bì chả” vừa hết. Vui lòng bỏ món này hoặc chọn món khác.</span>
    </div>` : ''}
    ${cart.map((l,i)=>{
      const it = byId(l.id), isBad = bad.includes(l.id)
      return `<div class="line ${isBad?'bad':''}">
        <div class="line-th">${it.slug
          ? `<img src="menu-images/${it.slug}.jpg" width="64" height="64" loading="lazy" decoding="async" alt="">`
          : `<div class="ph" aria-hidden="true">${it.name[0]}</div>`}</div>
        <div class="line-in">
          <p class="line-nm">${it.name}</p>
          <p class="line-pr num">${fmt(it.price)}</p>
          <button class="note-btn" data-note="${i}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            ${l.note ? `<span class="note-txt">${l.note}</span>` : 'Thêm ghi chú'}
          </button>
        </div>
        <div class="line-rt">
          <span class="line-tot num">${fmt(it.price*l.n)}</span>
          <span class="stp">
            <button data-dec="${i}" aria-label="Bớt ${it.name}">−</button>
            <span class="num">${l.n}</span>
            <button data-inc="${i}" aria-label="Thêm ${it.name}">+</button>
          </span>
        </div></div>`}).join('')}

    <div class="sum"><dl>
      <div class="sum-row"><dt>Tạm tính (${cartCount(cart)} món)</dt>
        <dd class="num">${fmt(cartTotal(cart))}</dd></div>
      <div class="sum-row"><dt>Phí phục vụ</dt><dd>Không</dd></div>
      <div class="sum-row big"><dt>Tổng cộng</dt>
        <dd class="num">${fmt(cartTotal(cart))}</dd></div>
    </dl></div>

    <div class="foot">
      <button class="btn btn-primary btn-lg btn-block" id="send" ${sending?'disabled':''}>
        ${sending ? '<span class="spin"></span> Đang gửi...' : 'Gửi đơn'}
      </button>
    </div>`
}

document.getElementById('main').addEventListener('click', e=>{
  const cart = getCart()
  const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]')
  const nb  = e.target.closest('[data-note]')

  if (inc){ cart[+inc.dataset.inc].n++; setCart(cart); render(); return }
  if (dec){
    const i = +dec.dataset.dec
    if (cart[i].n > 1) cart[i].n--
    else { toast('Đã xoá ' + byId(cart[i].id).name); cart.splice(i,1) }
    setCart(cart); render(); return
  }
  if (nb){
    const i = +nb.dataset.note
    const v = prompt('Ghi chú cho “'+byId(cart[i].id).name+'”\n(ví dụ: ít đá, không rau, thêm ớt)', cart[i].note||'')
    if (v !== null){ cart[i].note = v.trim(); setCart(cart); render() }
    return
  }
  if (e.target.closest('#send')){
    if (sending) return                     // chan double-submit
    sending = true; render()
    setTimeout(()=>{ sending = false; location.href = 'guest-success.html' }, 1400)
  }
})

/* nut dev de xem cac trang thai */
document.body.insertAdjacentHTML('beforeend', `
  <div style="position:fixed;left:12px;bottom:12px;z-index:90;display:flex;gap:6px">
    <button class="btn btn-secondary" style="height:34px;font-size:12px;padding:0 12px"
      onclick="setCart([]);render()">Giỏ rỗng</button>
    <button class="btn btn-secondary" style="height:34px;font-size:12px;padding:0 12px"
      onclick="showUnavailable=!showUnavailable;render()">Lỗi hết món</button>
  </div>`)

render()
</script>
</body>
</html>
