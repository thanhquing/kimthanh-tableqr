services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tableqr
      POSTGRES_USER: tableqr
      POSTGRES_PASSWORD: tableqr
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableqr -d tableqr"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: tableqr-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://tableqr:tableqr@db:5432/tableqr?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
