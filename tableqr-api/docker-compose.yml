services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tableqr
      POSTGRES_USER: tableqr
      POSTGRES_PASSWORD: tableqr
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableqr -d tableqr"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: tableqr-api/Dockerfile
    environment:
      # Runtime chi co role RLS; migrate/seed van dung owner tableqr.
      DATABASE_URL: postgresql://tableqr:tableqr@db:5432/tableqr?schema=public&options=-c%20role=tableqr_app
      NODE_ENV: development
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    volumes: [./uploads:/app/uploads]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
  migrate:
    build:
      context: ..
      dockerfile: tableqr-api/Dockerfile
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://tableqr:tableqr@db:5432/tableqr?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  postgres_data:
